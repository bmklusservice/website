<html lang="en">

      <nav aria-label="Primary navigation">

        <a href="about.html">About</a>

    <main>
      <section class="path-section main-gateway" aria-label="Choose a section">
        <div class="path-layout">
          <div class="path-grid">
            <a class="path-card bm-card" href="bm-klussenservice.html">

            <a class="path-card portfolio-card" href="portfolio.html">

              <div>
                <h2>Portfolio</h2>
              </div>
            </a>
          </div>

          <div class="secondary-actions">
            <a class="contact-button" href="about.html">About me</a>
